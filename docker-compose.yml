services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: futbol
      POSTGRES_USER: futbol
      POSTGRES_PASSWORD: futbol
    ports:
      - "15432:5432"
    volumes:
      - futbol_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  futbol_postgres_data:
