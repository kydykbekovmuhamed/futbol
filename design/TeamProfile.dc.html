<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:oklch(0.16 0.014 55);
      --surface:oklch(0.215 0.017 55);
      --surface2:oklch(0.27 0.019 55);
      --text:oklch(0.97 0.008 90);
      --muted:oklch(0.66 0.02 80);
      --lime:oklch(0.87 0.22 126);
      --orange:oklch(0.68 0.19 38);
      --line:oklch(1 0 0 / 0.09);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .screen{width:390px;min-height:924px;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;position:relative;overflow:hidden;}
    .disp{font-family:'Big Shoulders Display',sans-serif;font-weight:900;}
    .icon{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;}
    .avatar{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:15px;color:var(--muted);flex:0 0 auto;}
  </style>
</helmet>

<div class="screen">

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:26px 20px 0;">
    <div style="width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;">
      <svg width="16" height="16" viewBox="0 0 24 24" class="icon"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:0.05em;">КОМАНДА</div>
    <div style="width:38px;height:38px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;">
      <svg width="15" height="15" viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
    </div>
  </div>

  <!-- crest + name -->
  <div style="display:flex;align-items:center;gap:16px;padding:20px 20px 0;">
    <svg width="72" height="72" viewBox="0 0 72 72">
      <polygon points="36,3 66,20 66,50 36,69 6,50 6,20" fill="var(--surface)" stroke="var(--lime)" stroke-width="2"/>
      <polygon points="36,16 55,27 55,45 36,56 17,45 17,27" fill="none" stroke="var(--lime)" stroke-width="1.4" opacity="0.55"/>
      <text x="36" y="43" font-family="'Big Shoulders Display',sans-serif" font-weight="900" font-size="24" fill="var(--lime)" text-anchor="middle">Б</text>
    </svg>
    <div>
      <div class="disp" style="font-size:30px;line-height:0.95;">БАРС FC</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:5px;">Октябрьский р-н · с 2024</div>
    </div>
  </div>

  <!-- rank card -->
  <div style="margin:20px 20px 0;">
    <div class="card" style="padding:18px;position:relative;overflow:hidden;">
      <div style="position:absolute;top:0;right:0;width:140px;height:140px;background:radial-gradient(circle,oklch(0.87 0.22 126 / 0.15),transparent 70%);"></div>
      <div style="position:relative;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <svg width="34" height="34" viewBox="0 0 24 24" style="stroke:var(--lime);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M10 14v3h4v-3"/><path d="M8 20h8"/></svg>
          <div>
            <div style="font-size:11px;color:var(--muted);">ЗВАНИЕ</div>
            <div class="disp" style="font-size:22px;color:var(--lime);line-height:1;">ПРОФИ</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div class="disp" style="font-size:30px;line-height:1;">78</div>
          <div style="font-size:10.5px;color:var(--muted);">очков</div>
        </div>
      </div>
      <div style="position:relative;margin-top:16px;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;">
        <div style="width:78%;height:100%;background:linear-gradient(90deg,var(--lime),oklch(0.9 0.2 126));"></div>
      </div>
      <div style="position:relative;font-size:11px;color:var(--muted);margin-top:8px;">22 очка до «Легенда двора»</div>
    </div>
  </div>

  <!-- stats -->
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px 20px 0;">
    <div class="card" style="padding:14px 8px;text-align:center;">
      <div class="disp" style="font-size:26px;">24</div>
      <div style="font-size:10px;color:var(--muted);">матчи</div>
    </div>
    <div class="card" style="padding:14px 8px;text-align:center;">
      <div class="disp" style="font-size:26px;color:var(--lime);">17</div>
      <div style="font-size:10px;color:var(--muted);">победы</div>
    </div>
    <div class="card" style="padding:14px 8px;text-align:center;">
      <div class="disp" style="font-size:26px;">71%</div>
      <div style="font-size:10px;color:var(--muted);">побед</div>
    </div>
  </div>

  <!-- form strip -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;">
    <div style="font-size:11.5px;color:var(--muted);font-weight:600;">ПОСЛЕДНИЕ 5</div>
    <div style="display:flex;gap:6px;">
      <div style="width:22px;height:22px;border-radius:6px;background:var(--lime);"></div>
      <div style="width:22px;height:22px;border-radius:6px;background:var(--lime);"></div>
      <div style="width:22px;height:22px;border-radius:6px;background:var(--orange);"></div>
      <div style="width:22px;height:22px;border-radius:6px;background:var(--lime);"></div>
      <div style="width:22px;height:22px;border-radius:6px;background:var(--surface2);"></div>
    </div>
  </div>

  <!-- roster -->
  <div style="padding:22px 20px 0;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <div class="disp" style="font-size:19px;">СОСТАВ</div>
      <div style="font-size:12px;color:var(--muted);">12 игроков</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px;">
        <div class="avatar">АЖ</div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">Азамат Жунусов</div>
          <div style="font-size:11px;color:var(--muted);">Нападающий</div>
        </div>
        <div style="background:var(--lime);color:oklch(0.18 0.03 126);font-size:10px;font-weight:700;padding:4px 9px;border-radius:7px;">КАПИТАН</div>
      </div>
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px;">
        <div class="avatar">БТ</div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">Бакыт Токтогулов</div>
          <div style="font-size:11px;color:var(--muted);">Вратарь</div>
        </div>
      </div>
      <div class="card" style="padding:12px 14px;display:flex;align-items:center;gap:12px;">
        <div class="avatar">ЭК</div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">Эрлан Кадыров</div>
          <div style="font-size:11px;color:var(--muted);">Защитник</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CTA -->
  <div style="padding:20px 20px 26px;">
    <div style="background:var(--orange);color:oklch(0.15 0.02 40);font-weight:700;font-size:15px;padding:16px;border-radius:15px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" style="stroke:oklch(0.15 0.02 40);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M13 2L3 14h7l-1 8 11-13h-7l1-7z"/></svg>
      Бросить вызов
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
