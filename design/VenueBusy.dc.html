<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --bg:oklch(0.16 0.014 55);
      --surface:oklch(0.215 0.017 55);
      --surface2:oklch(0.27 0.019 55);
      --text:oklch(0.97 0.008 90);
      --muted:oklch(0.66 0.02 80);
      --lime:oklch(0.87 0.22 126);
      --orange:oklch(0.68 0.19 38);
      --line:oklch(1 0 0 / 0.09);
    }
    *{box-sizing:border-box;}
    body{margin:0;}
    .screen{width:390px;min-height:924px;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;position:relative;overflow:hidden;}
    .disp{font-family:'Big Shoulders Display',sans-serif;font-weight:900;}
    .icon{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;}
  </style>
</helmet>

<div class="screen">

  <!-- night pitch hero, drawn not photographed -->
  <div style="height:300px;position:relative;overflow:hidden;background:
      radial-gradient(120% 70% at 20% -10%, oklch(0.30 0.05 55) 0%, transparent 55%),
      linear-gradient(180deg, oklch(0.20 0.02 55) 0%, var(--bg) 100%);">
    <svg width="390" height="300" viewBox="0 0 390 300" style="position:absolute;inset:0;">
      <line x1="0" y1="150" x2="390" y2="150" stroke="oklch(1 0 0 / 0.14)" stroke-width="2"/>
      <circle cx="195" cy="150" r="46" fill="none" stroke="oklch(1 0 0 / 0.14)" stroke-width="2"/>
      <circle cx="195" cy="150" r="3" fill="oklch(1 0 0 / 0.25)"/>
      <path d="M0 40 L60 240" stroke="oklch(1 0 0 / 0.06)" stroke-width="70"/>
      <path d="M390 10 L300 290" stroke="oklch(1 0 0 / 0.05)" stroke-width="90"/>
      <g opacity="0.9">
        <path d="M28 34l7 12h-14z" fill="oklch(0.87 0.22 126)"/>
        <path d="M362 20l7 12h-14z" fill="oklch(0.87 0.22 126)"/>
        <path d="M40 30l-8 5M40 30l3 9M40 30l11 3" stroke="oklch(0.87 0.22 126 / 0.7)" stroke-width="1.4"/>
        <path d="M374 16l-8 5M374 16l3 9M374 16l11 3" stroke="oklch(0.87 0.22 126 / 0.7)" stroke-width="1.4"/>
      </g>
    </svg>
    <div style="position:absolute;inset:0;background:linear-gradient(180deg, transparent 40%, var(--bg) 100%);"></div>
    <div style="position:absolute;top:26px;left:20px;width:40px;height:40px;border-radius:12px;background:oklch(0.14 0.012 55 / 0.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" class="icon"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="position:absolute;top:26px;right:20px;width:40px;height:40px;border-radius:12px;background:oklch(0.14 0.012 55 / 0.7);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;">
      <svg width="17" height="17" viewBox="0 0 24 24" class="icon"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1L12 21l7.8-7.5 1-1a5.5 5.5 0 0 0 0-7.9z"/></svg>
    </div>
  </div>

  <div style="padding:0 20px;margin-top:-42px;position:relative;">

    <!-- status badge -->
    <div style="display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:oklch(0.15 0.02 40);font-weight:700;font-size:12.5px;padding:8px 14px;border-radius:11px;">
      <span style="width:8px;height:8px;border-radius:50%;background:oklch(0.15 0.02 40);display:inline-block;"></span>
      ЗАНЯТО ДО 14:00
    </div>

    <div class="disp" style="font-size:26px;margin-top:16px;line-height:1;">БАЙТИК АРЕНА</div>
    <div style="font-size:13px;color:var(--muted);margin-top:6px;">Свердловский р-н · 5.6 км · Искусственный газон</div>

    <!-- huge countdown -->
    <div class="card" style="margin-top:20px;padding:26px 20px;text-align:center;position:relative;overflow:hidden;">
      <div style="position:absolute;inset:0;background:radial-gradient(60% 80% at 50% 0%, oklch(0.68 0.19 38 / 0.16), transparent);"></div>
      <div style="position:relative;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0.04em;">ОСВОБОДИТСЯ ЧЕРЕЗ</div>
      <div class="disp" style="position:relative;font-size:88px;line-height:1;color:var(--orange);margin-top:6px;">23:47</div>
      <div style="position:relative;display:flex;justify-content:center;gap:5px;margin-top:14px;">
        <div style="width:56px;height:5px;border-radius:3px;background:var(--orange);"></div>
        <div style="width:16px;height:5px;border-radius:3px;background:var(--surface2);"></div>
        <div style="width:16px;height:5px;border-radius:3px;background:var(--surface2);"></div>
        <div style="width:16px;height:5px;border-radius:3px;background:var(--surface2);"></div>
      </div>
    </div>

    <!-- details -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px;">
      <div class="card" style="padding:14px 10px;text-align:center;">
        <div class="disp" style="font-size:20px;color:var(--lime);">700</div>
        <div style="font-size:10.5px;color:var(--muted);">сом/час</div>
      </div>
      <div class="card" style="padding:14px 10px;text-align:center;">
        <div class="disp" style="font-size:20px;">7×7</div>
        <div style="font-size:10.5px;color:var(--muted);">вместимость</div>
      </div>
      <div class="card" style="padding:14px 10px;text-align:center;">
        <div class="disp" style="font-size:20px;">4.8</div>
        <div style="font-size:10.5px;color:var(--muted);">рейтинг</div>
      </div>
    </div>

    <!-- CTAs -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:20px;">
      <div style="background:var(--lime);color:oklch(0.18 0.03 126);font-weight:700;font-size:14.5px;padding:15px;border-radius:14px;text-align:center;">
        Посмотреть другое время
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);color:var(--text);font-weight:600;font-size:14px;padding:14px;border-radius:14px;text-align:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" class="icon"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        Уведомить, когда освободится
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
